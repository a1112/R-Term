name: Windows repository boundary
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "4"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ci/check-rterm-feature-boundary.py
      - run: cargo fmt --all --check
      - run: cargo test --locked -p rssh-app --no-default-features --bin rterm -j 2
      - run: cargo test --locked -p rssh-app --test feature_boundary --test local_pty --test native_window_e2e -j 2
      - run: cargo check --locked -p rssh-app --features ssh -j 2
      - run: cargo build --locked -j 2
