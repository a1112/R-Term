[package]
name = "rssh-app"
default-run = "rterm"
autobins = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "rterm"
path = "src/main.rs"

[features]
default = ["production-gui"]
developer-full = [
    "production-gui",
    "ssh",
    "image-gif",
    "image-legacy",
    "transfer-tools",
    "diagnostic-tools",
]
production-gui = ["native-gui", "local-pty", "image-basic", "production-fonts"]
production-fonts = ["rssh-fonts/shared-source-ownership"]
# Reserved for verified frozen-source preparation; never enabled by normal profiles.
rterm-legacy-0-1 = []
native-gui = []
ssh = ["dep:rssh-ssh", "dep:rpassword"]
local-pty = []
image-basic = ["rterm-render-cpu/image-basic", "rterm-render-wgpu/image-basic"]
image-gif = ["rterm-render-cpu/image-gif", "rterm-render-wgpu/image-gif"]
image-legacy = ["rterm-render-cpu/image-legacy", "rterm-render-wgpu/image-legacy"]
transfer-tools = ["ssh"]
diagnostic-tools = ["rssh-fonts/diagnostic-tools"]
functional-test-observer = ["dep:rssh-functional-tests"]

[dependencies]
arboard = "3"
base64 = "0.22"
crossterm = "0.29"
notify = "8"
pollster = "0.4"
regex = "1"
rpassword = { version = "7", optional = true }
rssh-config = { path = "../rssh-config", version = "0.1.0" }
rssh-core = { path = "../rssh-core", version = "0.1.0" }
rssh-diagnostics = { path = "../rssh-diagnostics", version = "0.1.0", default-features = false }
rssh-fonts = { package = "rterm-fonts", path = "../rterm-fonts", version = "0.1.0" }
rssh-functional-tests = { path = "../rssh-functional-tests", version = "0.1.0", optional = true }
rssh-native = { path = "../rssh-native", version = "0.1.0" }
rssh-pty = { path = "../rssh-pty", version = "0.1.0", features = ["runtime-adapter"] }
rterm-render-core = { path = "../rterm-render-core", version = "0.1.0" }
rterm-render-cpu = { path = "../rterm-render-cpu", version = "0.1.0", default-features = false }
rterm-render-wgpu = { path = "../rterm-render-wgpu", version = "0.1.0", default-features = false }
rterm-runtime = { path = "../rssh-runtime", version = "0.1.0" }
rssh-ssh = { optional = true, package = "rterm-ssh-adapter", path = "../rssh-ssh", version = "0.1.0", features = ["runtime-adapter"] }
rssh-terminal = { package = "rterm-terminal", path = "../rssh-terminal", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "=0.4.8"
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
toml = "0.8"
unicode_names2 = "3.1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
wezterm-color-types = "=0.3.0"
winit = "0.30"

[dev-dependencies]
# Frozen GPU's headless constructor requires an explicit public texture format.
wgpu = { version = "=30.0.0", default-features = false, features = ["std"] }
rterm-runtime = { path = "../rssh-runtime", version = "0.1.0", features = ["test-support"] }
rssh-test-support = { path = "../rssh-test-support", version = "0.1.0" }
sha2 = "0.11"

[lints]
workspace = true

[[test]]
name = "openssh_loopback"
required-features = ["ssh"]

[[test]]
name = "transfer_loopback"
required-features = ["transfer-tools"]

[[test]]
name = "diagnostics_ssh1"
required-features = ["diagnostic-tools", "ssh"]

[[test]]
name = "diagnostics_gui"
required-features = ["diagnostic-tools"]
